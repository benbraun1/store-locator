<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Les Imprimeuses — Store Locator (mobile)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #191919;
      --surface2: #222222;
      --border: #2e2e2e;
      --text: #e8e8e8;
      --text-muted: #888;
      --text-dim: #555;

      --brand: #54215D;
      --brand-light: #D5A3FF;

      /* RFM segments — identiques à index.html */
      --champion:   #4ADE80;
      --loyal:      #60A5FA;
      --new:        #FACC15;
      --atrisk:     #FB923C;
      --occasional: #A78BFA;
      --inactive:   #555;

      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── MAP ── */
    #map {
      position: fixed;
      inset: 0;
      background: #1a1a1a;
      z-index: 1;
    }

    /* ── TOP BAR ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: calc(var(--safe-top) + 10px) 14px 8px;
      background: linear-gradient(to bottom, rgba(15,15,15,0.96) 0%, rgba(15,15,15,0.85) 70%, rgba(15,15,15,0) 100%);
      pointer-events: none;
    }

    #topbar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: auto;
    }

    #topbar-head img {
      width: 120px;
      height: auto;
      display: block;
    }

    #store-count {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-align: right;
      white-space: nowrap;
    }

    #store-count b { color: var(--text); font-weight: 500; }

    /* ── CHIPS (légende + filtre) ── */
    #chips {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      pointer-events: auto;
      padding-bottom: 2px;
    }

    #chips::-webkit-scrollbar { display: none; }

    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(25,25,25,0.92);
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.15s;
    }

    .chip.active { color: var(--text); }

    .chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; opacity: 0.4; }
    .chip.active .chip-dot { opacity: 1; }

    .chip[data-segment="champion"]   .chip-dot { background: var(--champion); }
    .chip[data-segment="loyal"]      .chip-dot { background: var(--loyal); }
    .chip[data-segment="new"]        .chip-dot { background: var(--new); }
    .chip[data-segment="atrisk"]     .chip-dot { background: var(--atrisk); }
    .chip[data-segment="occasional"] .chip-dot { background: var(--occasional); }
    .chip[data-segment="inactive"]   .chip-dot { background: var(--inactive); }

    .chip[data-segment="champion"].active   { border-color: var(--champion);   background: rgba(74,222,128,0.14); }
    .chip[data-segment="loyal"].active      { border-color: var(--loyal);      background: rgba(96,165,250,0.14); }
    .chip[data-segment="new"].active        { border-color: var(--new);        background: rgba(250,204,21,0.14); }
    .chip[data-segment="atrisk"].active     { border-color: var(--atrisk);     background: rgba(251,146,60,0.14); }
    .chip[data-segment="occasional"].active { border-color: var(--occasional); background: rgba(167,139,250,0.14); }
    .chip[data-segment="inactive"].active   { border-color: #666;              background: rgba(120,120,120,0.14); }

    /* ── FLOATING BUTTONS ── */
    #fab-locate {
      position: fixed;
      right: 14px;
      bottom: calc(var(--safe-bottom) + 22px);
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 900;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
    }

    #fab-locate:active { background: var(--surface2); }
    #fab-locate svg { width: 20px; height: 20px; }
    #fab-locate.locating svg { animation: pulse 1s ease-in-out infinite; }
    body.sheet-open #fab-locate { transform: translateY(20px); opacity: 0; pointer-events: none; }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* ── BOTTOM SHEET (fiche revendeur) ── */
    #sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 1100;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
      transform: translateY(105%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 78dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: var(--safe-bottom);
      touch-action: pan-y;
    }

    #sheet.visible { transform: translateY(0); }
    #sheet.dragging { transition: none; }

    #sheet-handle {
      flex-shrink: 0;
      padding: 10px 0 6px;
      display: flex;
      justify-content: center;
    }

    #sheet-handle span {
      width: 38px; height: 4px;
      border-radius: 2px;
      background: #3a3a3a;
    }

    #sheet-scroll {
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 0 20px 20px;
    }

    #sheet-close {
      position: absolute;
      top: 12px; right: 12px;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 18px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-segment {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .detail-segment::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .detail-segment.champion   { color: var(--champion); }
    .detail-segment.loyal      { color: var(--loyal); }
    .detail-segment.new        { color: var(--new); }
    .detail-segment.atrisk     { color: var(--atrisk); }
    .detail-segment.occasional { color: var(--occasional); }
    .detail-segment.inactive   { color: #777; }

    #detail-name {
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.25;
      padding-right: 36px;
    }

    #detail-address {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 16px 0 14px;
    }

    .stat {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .stat-key {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-val small { font-size: 11px; color: var(--text-muted); font-weight: 400; }

    #detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }

    #detail-tags:empty { display: none; }

    .tag {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 6px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .action {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
    }

    .action:active { background: #2a2a2a; }
    .action.primary { background: var(--brand); border-color: var(--brand); }
    .action.primary:active { background: #6a2d76; }
    .action svg { width: 16px; height: 16px; flex-shrink: 0; }
    .action[hidden] { display: none; }

    /* ── LOADING ── */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      gap: 16px;
      transition: opacity 0.4s;
    }

    #loading.hidden { opacity: 0; pointer-events: none; }

    .loading-logo { width: 160px; height: auto; opacity: 0.9; }

    .loading-bar { width: 160px; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
    .loading-fill { height: 100%; background: var(--text-muted); animation: loading 1.5s ease-in-out infinite; }

    @keyframes loading {
      0% { width: 0%; margin-left: 0; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }

    .loading-status { font-size: 12px; color: var(--text-dim); text-align: center; padding: 0 30px; }
    .loading-status.error { color: #ff6b6b; }

    /* ── MARKERS ── */
    .pin {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pin i {
      display: block;
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 0 0 3px var(--ring), 0 2px 8px rgba(0,0,0,0.6);
      transition: width 0.15s, height 0.15s, box-shadow 0.15s;
    }

    .pin.selected i {
      width: 24px; height: 24px;
      border-color: rgba(255,255,255,0.9);
      box-shadow: 0 0 0 5px var(--ring), 0 4px 14px rgba(0,0,0,0.8);
    }

    .pin.inactive i { border-color: rgba(255,255,255,0.15); }

    /* ── LEAFLET (dark) ── */
    .leaflet-tile-pane { filter: brightness(0.75) saturate(0.5); }
    .leaflet-control-attribution {
      background: rgba(15,15,15,0.6) !important;
      color: var(--text-dim) !important;
      font-size: 9px !important;
      margin-bottom: var(--safe-bottom) !important;
    }
    .leaflet-control-attribution a { color: var(--text-dim) !important; }
    .leaflet-container { font-family: inherit; }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <img class="loading-logo" id="loading-logo" alt="Les Imprimeuses" />
  <div class="loading-bar"><div class="loading-fill"></div></div>
  <div class="loading-status" id="loading-status">Chargement des boutiques…</div>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- TOP BAR -->
<div id="topbar">
  <div id="topbar-head">
    <img id="logo-img" alt="Les Imprimeuses" />
    <div id="store-count"><b id="count-active">—</b> actives · <b id="count-inactive">—</b> inactives</div>
  </div>
  <div id="chips">
    <div class="chip active" data-segment="champion"><span class="chip-dot"></span>Champions</div>
    <div class="chip active" data-segment="loyal"><span class="chip-dot"></span>Fidèles</div>
    <div class="chip active" data-segment="new"><span class="chip-dot"></span>Nouveaux</div>
    <div class="chip active" data-segment="atrisk"><span class="chip-dot"></span>À relancer</div>
    <div class="chip active" data-segment="occasional"><span class="chip-dot"></span>Occasionnels</div>
    <div class="chip active" data-segment="inactive"><span class="chip-dot"></span>Inactifs</div>
  </div>
</div>

<!-- LOCATE ME -->
<button id="fab-locate" aria-label="Ma position">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/>
  </svg>
</button>

<!-- BOTTOM SHEET -->
<div id="sheet" role="dialog" aria-modal="false">
  <div id="sheet-handle"><span></span></div>
  <button id="sheet-close" aria-label="Fermer">×</button>
  <div id="sheet-scroll">
    <div class="detail-segment" id="detail-segment"></div>
    <div id="detail-name"></div>
    <div id="detail-address"></div>

    <div class="stats">
      <div class="stat">
        <div class="stat-key">Dernière commande</div>
        <div class="stat-val" id="detail-last-date"></div>
      </div>
      <div class="stat">
        <div class="stat-key">Montant</div>
        <div class="stat-val" id="detail-last-amount"></div>
      </div>
      <div class="stat">
        <div class="stat-key">Total lifetime</div>
        <div class="stat-val" id="detail-lifetime"></div>
      </div>
      <div class="stat">
        <div class="stat-key">Nb commandes</div>
        <div class="stat-val" id="detail-orders"></div>
      </div>
    </div>

    <div id="detail-tags"></div>

    <div class="actions">
      <a class="action primary" id="action-route" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        Itinéraire
      </a>
      <a class="action" id="action-email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        Email
      </a>
    </div>
  </div>
</div>

// ── PARSE HELPERS ─────────────────────────────────────────────────────────────
function parseDate(str) {
  if (!str) return null;
  try {
    // Format CSV : "2025-01-19 10:52:53 +0100"
    const normalized = str.trim()
      .replace(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2}) ([+-]\d{4})$/, "$1T$2$3")
      .replace(/([+-])(\d{2})(\d{2})$/, "$1$2:$3");
    const d = new Date(normalized);
    return isNaN(d.getTime()) ? new Date(str.trim()) : d;
  } catch (e) {
    return null;
  }
}

function quantile(sortedValues, p) {
  if (sortedValues.length === 0) return 0;
  const idx = (sortedValues.length - 1) * p;
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if (lo === hi) return sortedValues[lo];
  return sortedValues[lo] + (sortedValues[hi] - sortedValues[lo]) * (idx - lo);
}

// ── RFM SEGMENTATION (copie conforme d'index.html) ────────────────────────────
function classifySegment(store, thresholds, now) {
  if (!store.isActive) return "inactive";

  const monthsSince = (now - store.lastDate) / (1000 * 60 * 60 * 24 * 30.44);
  const isRecent  = monthsSince < 3;
  const isStale   = monthsSince >= 3 && monthsSince < 6;
  const isDormant = monthsSince >= 6 && monthsSince < 12;
  const isHighLTV = store.lifetime >= thresholds.p75;
  const isMidLTV  = store.lifetime >= thresholds.p50;
  const isRepeat  = store.totalOrders >= 2;

  if (isRecent && isHighLTV) return "champion";
  if ((isStale || isDormant) && isMidLTV && isRepeat) return "atrisk";
  if (isRepeat && isMidLTV && (isRecent || isStale)) return "loyal";
  if (isRecent && !isRepeat) return "new";
  return "occasional";
}

// ── PARSE CSV ─────────────────────────────────────────────────────────────────
function parseCSV(csvText) {
  const result = Papa.parse(csvText, { header: true, skipEmptyLines: true });
  const rows = result.data;

  const topRows = rows.filter(r => (r["Top Row"] || "").toLowerCase() === "true");

  const now = new Date();
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - ACTIVE_MONTHS);

  const stores = [];

  topRows.forEach((r, i) => {
    const totalOrders = parseInt(r["Total Orders"]) || 0;
    if (totalOrders === 0) return;
    if (EXCLUDED_IDS.has(r["ID"])) return;

    const lastOrderDate = parseDate(r["Last Order: Processed At"]);
    if (!lastOrderDate || isNaN(lastOrderDate.getTime())) return;

    const company = NAME_OVERRIDES[r["ID"]] || r["Address Company"] || `${r["First Name"] || ""} ${r["Last Name"] || ""}`.trim();
    const city    = r["Address City"] || "";
    const country = r["Address Country"] || "";
    const zip     = r["Address Zip"] || "";
    const lat = parseFloat((r["_lat"] || "").toString().replace(",", ".")) || null;
    const lng = parseFloat((r["_lng"] || "").toString().replace(",", ".")) || null;

    if (!city && !country) return;

    stores.push({
      id:          r["ID"] || String(i),
      name:        company,
      email:       r["Email"] || "",
      city, country, zip,
      address:     r["Address Line 1"] || "",
      isActive:    lastOrderDate >= cutoff,
      tags:        r["Tags"] || "",
      lastDate:    lastOrderDate,
      lastAmount:  parseFloat(r["Last Order: Price Total"]) || 0,
      lifetime:    parseFloat(r["Total Spent"]) || 0,
      totalOrders,
      lat, lng,
    });
  });

  const activeLTVs = stores.filter(s => s.isActive).map(s => s.lifetime).sort((a, b) => a - b);
  const thresholds = { p50: quantile(activeLTVs, 0.50), p75: quantile(activeLTVs, 0.75) };
  stores.forEach(s => { s.segment = classifySegment(s, thresholds, now); });

  return stores;
}

function fmtDate(d) {
  if (!d) return "—";
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
}

function fmtEuro(n) {
  return n.toLocaleString("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
}

function relativeMonths(d) {
  if (!d) return "";
  const m = Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24 * 30.44));
  if (m < 1) return "ce mois-ci";
  if (m === 1) return "il y a 1 mois";
  if (m < 24) return `il y a ${m} mois`;
  return `il y a ${Math.floor(m / 12)} ans`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ── MARKERS ───────────────────────────────────────────────────────────────────
// Zone tactile de 32px, pastille visible de 16px (24px sélectionnée).
function pinIcon(store, selected) {
  const color = COLORS[store.segment] || COLORS.inactive;
  const cls = ["pin", selected ? "selected" : "", store.isActive ? "" : "inactive"].join(" ");
  return L.divIcon({
    className: "",
    html: `<div class="${cls}" style="--ring:${color}${selected ? "66" : "33"}"><i style="background:${color}"></i></div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 16],
  });
}

function makeMarker(store) {
  const zOffset = store.lastDate ? Math.floor(store.lastDate.getTime() / 100000) % 10000 : 0;
  return L.marker([store.lat, store.lng], { icon: pinIcon(store, false), zIndexOffset: zOffset, keyboard: false })
    .addTo(map)
    .on("click", (e) => { L.DomEvent.stopPropagation(e); selectStore(store.id); });
}

function highlightMarker(id) {
  allStores.forEach(s => {
    const m = markers[s.id];
    if (!m) return;
    const isSelected = s.id === id;
    m.setIcon(pinIcon(s, isSelected));
    m.setZIndexOffset(isSelected ? 10000 : 0);
  });
}

// ── SHEET ─────────────────────────────────────────────────────────────────────
const sheet = document.getElementById("sheet");

function openSheet(store) {
  const seg = store.segment;
  const segEl = document.getElementById("detail-segment");
  segEl.textContent = SEGMENT_LABELS[seg] || seg;
  segEl.className = `detail-segment ${seg}`;

  document.getElementById("detail-name").textContent = store.name;

  const line1 = store.address;
  const line2 = [store.zip, store.city].filter(Boolean).join(" ");
  const line3 = store.country && store.country !== "France" ? store.country : "";
  document.getElementById("detail-address").innerHTML =
    [line1, line2, line3].filter(Boolean).map(escapeHtml).join("<br>");

  document.getElementById("detail-last-date").innerHTML =
    `${fmtDate(store.lastDate)}<br><small>${relativeMonths(store.lastDate)}</small>`;
  document.getElementById("detail-last-amount").textContent = fmtEuro(store.lastAmount);
  document.getElementById("detail-lifetime").textContent = fmtEuro(store.lifetime);
  document.getElementById("detail-orders").textContent = store.totalOrders;

  const tags = store.tags.split(",").map(t => t.trim()).filter(Boolean);
  document.getElementById("detail-tags").innerHTML =
    tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");

  // Itinéraire : Apple Plans sur iOS, Google Maps ailleurs
  const routeEl = document.getElementById("action-route");
  const isApple = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const q = encodeURIComponent([store.name, store.address, store.zip, store.city].filter(Boolean).join(", "));
  routeEl.href = isApple
    ? `https://maps.apple.com/?q=${q}&ll=${store.lat},${store.lng}`
    : `https://www.google.com/maps/dir/?api=1&destination=${store.lat},${store.lng}`;

  const emailEl = document.getElementById("action-email");
  if (store.email) {
    emailEl.href = `mailto:${store.email}`;
    emailEl.hidden = false;
  } else {
    emailEl.hidden = true;
  }

  document.getElementById("sheet-scroll").scrollTop = 0;
  sheet.classList.add("visible");
  document.body.classList.add("sheet-open");
}

function closeSheet() {
  sheet.classList.remove("visible");
  sheet.style.transform = "";
  document.body.classList.remove("sheet-open");
  selectedId = null;
  highlightMarker(null);
}

// ── SELECT STORE ──────────────────────────────────────────────────────────────
function selectStore(id) {
  const store = allStores.find(s => s.id === id);
  if (!store) return;
  selectedId = id;
  highlightMarker(id);
  openSheet(store);

  // Remonte la carte pour que la pastille reste visible au-dessus de la fiche
  requestAnimationFrame(() => {
    const p = map.latLngToContainerPoint([store.lat, store.lng]);
    const target = window.innerHeight * 0.32;
    const topLimit = 140; // sous la barre du haut
    if (p.y > target) map.panBy([0, p.y - target], { animate: true, duration: 0.3 });
    else if (p.y < topLimit) map.panBy([0, p.y - topLimit], { animate: true, duration: 0.3 });
  });
}

// ── FILTERS ───────────────────────────────────────────────────────────────────
function applyFilters() {
  let nActive = 0, nInactive = 0;
  allStores.forEach(store => {
    const ok = activeFilters.has(store.segment);
    if (ok) { store.isActive ? nActive++ : nInactive++; }
    const marker = markers[store.id];
    if (!marker) return;
    if (ok && !map.hasLayer(marker)) marker.addTo(map);
    if (!ok && map.hasLayer(marker)) map.removeLayer(marker);
  });
  document.getElementById("count-active").textContent = nActive;
  document.getElementById("count-inactive").textContent = nInactive;

  if (selectedId && !activeFilters.has(allStores.find(s => s.id === selectedId)?.segment)) closeSheet();
}

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const seg = chip.dataset.segment;
    chip.classList.toggle("active");
    if (chip.classList.contains("active")) activeFilters.add(seg);
    else activeFilters.delete(seg);
    applyFilters();
  });
});

// ── SHEET GESTURES ────────────────────────────────────────────────────────────
document.getElementById("sheet-close").addEventListener("click", closeSheet);
map.on("click", () => { if (selectedId) closeSheet(); });

// Swipe vers le bas pour fermer (depuis la poignée ou quand le contenu est en haut)
let dragStartY = null, dragDy = 0;
const sheetScroll = document.getElementById("sheet-scroll");

sheet.addEventListener("touchstart", e => {
  if (sheetScroll.scrollTop > 0 && sheetScroll.contains(e.target)) { dragStartY = null; return; }
  dragStartY = e.touches[0].clientY;
  dragDy = 0;
}, { passive: true });

sheet.addEventListener("touchmove", e => {
  if (dragStartY === null) return;
  dragDy = Math.max(0, e.touches[0].clientY - dragStartY);
  if (dragDy > 0) {
    sheet.classList.add("dragging");
    sheet.style.transform = `translateY(${dragDy}px)`;
  }
}, { passive: true });

sheet.addEventListener("touchend", () => {
  if (dragStartY === null) return;
  sheet.classList.remove("dragging");
  if (dragDy > 90) closeSheet();
  else sheet.style.transform = "";
  dragStartY = null;
  dragDy = 0;
});

// ── GEOLOCATION ───────────────────────────────────────────────────────────────
const fab = document.getElementById("fab-locate");
fab.addEventListener("click", () => {
  if (!navigator.geolocation) return;
  fab.classList.add("locating");
  navigator.geolocation.getCurrentPosition(pos => {
    fab.classList.remove("locating");
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (!userMarker) {
      userMarker = L.circleMarker(ll, {
        radius: 7, color: "#fff", weight: 2, fillColor: "#2f7cf6", fillOpacity: 1, interactive: false,
      }).addTo(map);
    } else {
      userMarker.setLatLng(ll);
    }
    map.flyTo(ll, Math.max(map.getZoom(), 11), { duration: 0.8 });
  }, () => {
    fab.classList.remove("locating");
  }, { enableHighAccuracy: true, timeout: 8000 });
});

// ── MAIN ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const res = await fetch(CSV_URL + "&t=" + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    if (text.startsWith("Unauthorized")) throw new Error("Accès refusé au CSV");

    allStores = parseCSV(text);
    if (allStores.length === 0) throw new Error("Aucune boutique trouvée");

    allStores.forEach(store => {
      if (store.lat && store.lng) markers[store.id] = makeMarker(store);
    });

    // Vue initiale : le noyau dense (autour de la médiane), pas les boutiques
    // lointaines (Japon, USA…) qui écraseraient la carte au zoom 1 sur un
    // petit écran. Elles restent affichées, il suffit de dézoomer.
    const geocoded = allStores.filter(s => s.lat && s.lng);
    if (geocoded.length > 0) {
      const median = arr => { const a = [...arr].sort((x, y) => x - y); return a[Math.floor(a.length / 2)]; };
      const mLat = median(geocoded.map(s => s.lat)), mLng = median(geocoded.map(s => s.lng));
      const core = geocoded.filter(s => Math.abs(s.lat - mLat) < 6 && Math.abs(s.lng - mLng) < 8);
      const pts = (core.length >= 5 ? core : geocoded).map(s => [s.lat, s.lng]);
      map.fitBounds(L.latLngBounds(pts), {
        paddingTopLeft: [20, 130],
        paddingBottomRight: [20, 40],
      });
    }

    applyFilters();

    document.getElementById("loading").classList.add("hidden");
    setTimeout(() => document.getElementById("loading").style.display = "none", 400);
  } catch (err) {
    const st = document.getElementById("loading-status");
    st.textContent = `Erreur de chargement : ${err.message}`;
    st.classList.add("error");
    document.querySelector(".loading-fill").style.animation = "none";
    console.error(err);
  }
}

init();
</script>
